# separate terms of service, privacy policy, and support
# documentation.

name: trivy

# on:
#   push:
#     branches: [ "main" ]
#   pull_request:
#     # The branches below must be a subset of the branches above
#     branches: [ "main" ]
#   schedule:
#     - cron: '24 16 * * 0'

# permissions:
#   contents: read

on:
  # Manual trigger only from any branch
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run Trivy on'
        required: false
        default: 'main'
      build_flavor:
        description: 'Build flavor for tagging'
        required: false
        default: 'non_prod'
        type: choice
        options:
        - non_prod
        - prod

  # Allow this workflow to be called by other workflows
  workflow_call:
    inputs:
      branch:
        description: 'Branch to run Trivy on'
        required: false
        default: 'main'
        type: string
      build_flavor:
        description: 'Build flavor for tagging'
        required: false
        default: 'non_prod'
        type: string

jobs:
  build:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Build and Scan Docker Images
    runs-on: [self-hosted, linux, X64]
    outputs:
      vulnerability_found: ${{ steps.scan_summary.outputs.vulnerability_found }}
      images_scanned: ${{ steps.scan_summary.outputs.images_scanned }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git

      - name: Setup Dependencies  
        run: |
          # Remove any conflicting Docker packages
          sudo apt-get remove -y docker docker-engine docker.io containerd runc || true
          sudo apt-get autoremove -y
          
          # Install build dependencies
          sudo apt-get install -y \
            apt-transport-https \
            ca-certificates \
            curl \
            gnupg \
            lsb-release \
            libssl-dev \
            libcurl4-openssl-dev \
            libprotobuf-dev \
            protobuf-compiler \
            pkg-config

      - name: Install Docker
        run: |
          # Free up memory first
          sudo apt-get clean
          sudo apt-get autoclean
          sudo rm -rf /var/lib/apt/lists/*
          
          # Download and run Docker installation script
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          
          # Clean up installation script
          rm get-docker.sh
          
          # Add user to docker group
          sudo usermod -aG docker $USER        
          
          # Verify installation
          docker --version

      - name: Setup Docker
        run: |
          sudo systemctl start docker
          sudo systemctl enable docker
          sudo usermod -aG docker $USER

      - name: Make Build Script Executable
        run: |
          chmod +x ./production/packaging/build_and_test_all_in_docker
        
      - name: Run Custom Build Command
        run: |
          # Run the build with explicit workspace context
          ./production/packaging/build_and_test_all_in_docker \
          --instance azure_microsoft \
          --platform azure_microsoft \
          --mode ${{ github.event.inputs.build_flavor }}

      - name: List generated artifacts
        run: |
          echo "Generated artifacts for Key-Value Service:"
          echo "Generated artifacts in dist/:"
          ls -la dist/ 2>/dev/null || echo "No dist/ directory found"
          echo "Looking for key_value_service_image.tar:"
          ls -la dist/key_value_service_image.tar 2>/dev/null || echo "key_value_service_image.tar not found"

      - name: Check for Key-Value Service Docker tar file
        id: check_files
        run: |
          echo "Checking for Key-Value Service Docker tar file in dist directory..."
          if [ ! -d "dist" ]; then
            echo "❌ dist directory not found"
            echo "tar_files_found=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Check for key_value_service_image.tar file
          KV_TAR_FILE="dist/key_value_service_image.tar"
          if [ ! -f "$KV_TAR_FILE" ]; then
            echo "❌ key_value_service_image.tar not found in dist directory"
            echo "tar_files_found=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ Found Key-Value Service tar file: $KV_TAR_FILE"
          echo "tar_files_found=true" >> $GITHUB_OUTPUT
          
          # Save the tar file path for next steps
          echo "$KV_TAR_FILE" > tar_files_list.txt

      - name: Load and scan Key-Value Service Docker image
        id: scan_images
        run: |
          VULNERABILITY_FOUND=false
          IMAGES_SCANNED=0
          SCAN_RESULTS=""
          
          echo "🔍 Starting Key-Value Service Docker image scanning..."
          
          # Read the single tar file path
          tar_file=$(cat tar_files_list.txt)
          
          echo "📦 Processing Key-Value Service: $tar_file"
          
          # Load the Docker image from tar file
          echo "Loading Key-Value Service Docker image from tar file..."
          LOADED_OUTPUT=$(docker load -i "$tar_file")
          echo "$LOADED_OUTPUT"
          
          # Extract image name from docker load output
          IMAGE_NAME=$(echo "$LOADED_OUTPUT" | grep "Loaded image:" | cut -d' ' -f3)
          if [ -z "$IMAGE_NAME" ]; then
            echo "❌ Failed to extract image name from: $tar_file"
            exit 1
          fi
          
          echo "✅ Loaded Key-Value Service image: $IMAGE_NAME"
          IMAGES_SCANNED=1
          
          # Create SARIF output file for Key-Value Service
          SARIF_OUTPUT="trivy-results-key-value-service.sarif"
          
          echo "🔍 Running Trivy scan on Key-Value Service: $IMAGE_NAME"
          
          # Run Trivy scan in SARIF format
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd):/workspace \
            aquasec/trivy:latest image \
            --format sarif \
            --output "/workspace/$SARIF_OUTPUT" \
            --severity CRITICAL,HIGH,MEDIUM \
            "$IMAGE_NAME"
          
          # Check if vulnerabilities were found by examining scan exit code
          if docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --format table \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            "$IMAGE_NAME" > /dev/null 2>&1; then
            echo "✅ No critical/high vulnerabilities found in Key-Value Service"
            SCAN_RESULTS="✅ Key-Value Service: No critical/high vulnerabilities found"
          else
            echo "❌ Critical/high vulnerabilities found in Key-Value Service"
            VULNERABILITY_FOUND=true
            SCAN_RESULTS="❌ Key-Value Service: Critical/high vulnerabilities found"
          fi
          
          echo "vulnerability_found=$VULNERABILITY_FOUND" >> $GITHUB_OUTPUT
          echo "images_scanned=$IMAGES_SCANNED" >> $GITHUB_OUTPUT
          echo "scan_results<<EOF" >> $GITHUB_OUTPUT
          echo "$SCAN_RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "📋 Key-Value Service Scan Summary:"
          echo "Images scanned: $IMAGES_SCANNED"
          echo "Vulnerabilities found: $VULNERABILITY_FOUND"
          echo "$SCAN_RESULTS"

      - name: Upload Key-Value Service Trivy SARIF results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-key-value-service-sarif-results
          path: trivy-results-key-value-service.sarif

      # Upload Key-Value Service SARIF to GitHub Security tab
      - name: Upload Key-Value Service SARIF to GitHub Security
        if: always() && hashFiles('trivy-results-key-value-service.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results-key-value-service.sarif'
          category: 'trivy-key-value-service'
        continue-on-error: true

      - name: Generate Key-Value Service security report
        id: scan_summary
        if: always()
        run: |
          echo "# Key-Value Service Security Scan Report" > security_report.md
          echo "**Service:** Protected Auction Key-Value Service" >> security_report.md
          echo "**Date:** $(date)" >> security_report.md
          echo "**Branch:** ${{ github.event.inputs.branch || github.ref_name }}" >> security_report.md
          echo "**Build Flavor:** ${{ github.event.inputs.build_flavor || 'non_prod' }}" >> security_report.md
          echo "" >> security_report.md
          echo "## Scan Results" >> security_report.md
          echo "Key-Value Service image scanned: ${{ steps.scan_images.outputs.images_scanned }}" >> security_report.md
          echo "Vulnerabilities found: ${{ steps.scan_images.outputs.vulnerability_found }}" >> security_report.md
          echo "" >> security_report.md
          echo "### Key-Value Service Results" >> security_report.md
          echo "${{ steps.scan_images.outputs.scan_results }}" >> security_report.md
          
          if [ "${{ steps.scan_images.outputs.vulnerability_found }}" = "true" ]; then
            echo "" >> security_report.md
            echo "## ⚠️ Action Required" >> security_report.md
            echo "Critical or high vulnerabilities were found in the Key-Value Service. Please review the SARIF file and address the vulnerabilities." >> security_report.md
          else
            echo "" >> security_report.md
            echo "## ✅ Security Status" >> security_report.md
            echo "No critical or high vulnerabilities found. Key-Value Service passed security scan." >> security_report.md
          fi
          
          cat security_report.md
          
          # Set outputs for other jobs
          echo "vulnerability_found=${{ steps.scan_images.outputs.vulnerability_found }}" >> $GITHUB_OUTPUT
          echo "images_scanned=${{ steps.scan_images.outputs.images_scanned }}" >> $GITHUB_OUTPUT

      - name: Upload Key-Value Service security report
        uses: actions/upload-artifact@v4
        with:
          name: key-value-service-security-report
          path: security_report.md

      - name: Cleanup build artifacts
        if: always()
        run: |
          echo "Cleaning up Key-Value Service build artifacts..."
          # Clean up any docker artifacts that might have permission issues
          docker container prune -f || true
          
          # Fix permissions on workspace files, subsequent runs fail,
          # because of some files with root permissions
          sudo chown -R $(whoami):$(whoami) ${GITHUB_WORKSPACE} || true
          
          echo "Cleanup completed for Key-Value Service"
          
          # Clean up any temporary mounts
          sudo umount /tmp/* 2>/dev/null || true
      